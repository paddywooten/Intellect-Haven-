<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Intellect Haven Admin</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar dashboard-navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="../../index.html">
                    <h1>🎓 Intellect Haven <span class="admin-badge">Admin</span></h1>
                </a>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="verification.html" class="nav-link">Verification</a>
                <a href="users.html" class="nav-link active">Users</a>
                <a href="bookings.html" class="nav-link">Bookings</a>
                <a href="reports.html" class="nav-link">Reports</a>
                <div class="nav-user">
                    <span id="userName">Admin</span>
                    <button class="btn btn-outline btn-small" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Users Content -->
    <div class="dashboard-container">
        <div class="container">
            <div class="dashboard-header">
                <div class="welcome-message">
                    <h2>User Management</h2>
                    <p>Manage all platform users</p>
                </div>
                <a href="dashboard.html" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

            <!-- Stats -->
            <div class="quick-stats-row">
                <div class="quick-stat">
                    <div class="quick-stat-icon" style="background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="quick-stat-content">
                        <h4 id="totalUsersCount">0</h4>
                        <p>Total Users</p>
                    </div>
                </div>
                <div class="quick-stat">
                    <div class="quick-stat-icon" style="background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div class="quick-stat-content">
                        <h4 id="teachersCount">0</h4>
                        <p>Teachers</p>
                    </div>
                </div>
                <div class="quick-stat">
                    <div class="quick-stat-icon" style="background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);">
                        <i class="fas fa-user-friends"></i>
                    </div>
                    <div class="quick-stat-content">
                        <h4 id="parentsCount">0</h4>
                        <p>Parents</p>
                    </div>
                </div>
                <div class="quick-stat">
                    <div class="quick-stat-icon" style="background: linear-gradient(135deg, #9C27B0 0%, #7B1FA2 100%);">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <div class="quick-stat-content">
                        <h4 id="adminsCount">0</h4>
                        <p>Admins</p>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="admin-filters">
                <div class="filters-grid">
                    <div class="form-group">
                        <label for="filterUserType">User Type</label>
                        <select id="filterUserType" onchange="applyFilters()">
                            <option value="all">All Types</option>
                            <option value="teacher">Teachers</option>
                            <option value="parent">Parents</option>
                            <option value="admin">Admins</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filterStatus">Status</label>
                        <select id="filterStatus" onchange="applyFilters()">
                            <option value="all">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="form-group search-box">
                        <label for="searchUser">Search</label>
                        <div style="position: relative;">
                            <i class="fas fa-search"></i>
                            <input type="text" id="searchUser" placeholder="Search by name or email..." oninput="applyFilters()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Users List -->
            <div class="dashboard-section">
                <div id="usersList">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading users...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Intellect Haven. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="../../config/firebase-config.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="../../js/app.js"></script>
    <script src="../../js/admin.js"></script>
    
    <script>
        let allUsers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadUserStats();
            applyFilters();
        });
        
        async function loadUserStats() {
            const usersSnapshot = await firebaseDB.collection('users').get();
            document.getElementById('totalUsersCount').textContent = usersSnapshot.size;
            
            let teachers = 0, parents = 0, admins = 0;
            usersSnapshot.forEach(doc => {
                const user = doc.data();
                if (user.userType === 'teacher') teachers++;
                else if (user.userType === 'parent') parents++;
                else if (user.userType === 'admin') admins++;
            });
            
            document.getElementById('teachersCount').textContent = teachers;
            document.getElementById('parentsCount').textContent = parents;
            document.getElementById('adminsCount').textContent = admins;
        }
        
        async function applyFilters() {
            const userType = document.getElementById('filterUserType').value;
            const status = document.getElementById('filterStatus').value;
            const search = document.getElementById('searchUser').value.toLowerCase();
            
            const snapshot = await firebaseDB.collection('users')
                .orderBy('createdAt', 'desc')
                .get();
            
            allUsers = [];
            
            for (const doc of snapshot.docs) {
                const user = { id: doc.id, ...doc.data() };
                
                // Apply user type filter
                if (userType !== 'all' && user.userType !== userType) {
                    continue;
                }
                
                // Apply status filter
                if (status === 'active' && !user.isActive) {
                    continue;
                }
                if (status === 'inactive' && user.isActive) {
                    continue;
                }
                
                // Apply search filter
                if (search) {
                    const fullName = `${user.firstName} ${user.lastName}`.toLowerCase();
                    const email = user.email.toLowerCase();
                    
                    if (!fullName.includes(search) && !email.includes(search)) {
                        continue;
                    }
                }
                
                // Get additional info based on user type
                if (user.userType === 'teacher') {
                    const teacherDoc = await firebaseDB.collection('teachers').doc(user.uid).get();
                    if (teacherDoc.exists) {
                        user.teacherData = teacherDoc.data();
                    }
                } else if (user.userType === 'parent') {
                    const childrenSnapshot = await firebaseDB.collection('children')
                        .where('parentId', '==', user.uid)
                        .get();
                    user.childrenCount = childrenSnapshot.size;
                    
                    const bookingsSnapshot = await firebaseDB.collection('bookings')
                        .where('parentId', '==', user.uid)
                        .get();
                    user.bookingsCount = bookingsSnapshot.size;
                }
                
                allUsers.push(user);
            }
            
            renderUsers(allUsers);
        }
        
        function renderUsers(users) {
            const container = document.getElementById('usersList');
            
            if (users.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <p>No users found</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = users.map(user => {
                const createdAt = user.createdAt.toDate();
                const dateStr = createdAt.toLocaleDateString('en-GB', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
                
                let badges = '';
                let stats = '';
                
                if (user.userType === 'teacher') {
                    const statusBadge = user.teacherData && user.teacherData.verificationStatus === 'verified' ? 
                        '<span class="user-badge verified">Verified</span>' : 
                        user.teacherData ? `<span class="user-badge" style="background: #FFF3E0; color: #E65100;">${user.teacherData.verificationStatus}</span>` : '';
                    
                    badges = `
                        <div class="user-badges">
                            <span class="user-badge teacher">Teacher</span>
                            ${statusBadge}
                            ${!user.isActive ? '<span class="user-badge" style="background: #FFEBEE; color: #C62828;">Inactive</span>' : ''}
                        </div>
                    `;
                    
                    if (user.teacherData) {
                        stats = `
                            <div class="user-stats">
                                <div class="user-stat">
                                    <span class="user-stat-value">${user.teacherData.totalSessions || 0}</span>
                                    <span class="user-stat-label">Sessions</span>
                                </div>
                                <div class="user-stat">
                                    <span class="user-stat-value">${(user.teacherData.rating || 0).toFixed(1)}</span>
                                    <span class="user-stat-label">Rating</span>
                                </div>
                                <div class="user-stat">
                                    <span class="user-stat-value">${formatCurrency(user.teacherData.hourlyRate || 0)}</span>
                                    <span class="user-stat-label">Rate</span>
                                </div>
                            </div>
                        `;
                    }
                } else if (user.userType === 'parent') {
                    badges = `
                        <div class="user-badges">
                            <span class="user-badge parent">Parent</span>
                            ${!user.isActive ? '<span class="user-badge" style="background: #FFEBEE; color: #C62828;">Inactive</span>' : ''}
                        </div>
                    `;
                    
                    stats = `
                        <div class="user-stats">
                            <div class="user-stat">
                                <span class="user-stat-value">${user.childrenCount || 0}</span>
                                <span class="user-stat-label">Children</span>
                            </div>
                            <div class="user-stat">
                                <span class="user-stat-value">${user.bookingsCount || 0}</span>
                                <span class="user-stat-label">Bookings</span>
                            </div>
                        </div>
                    `;
                } else if (user.userType === 'admin') {
                    badges = `
                        <div class="user-badges">
                            <span class="user-badge admin">Admin</span>
                        </div>
                    `;
                }
                
                return `
                    <div class="user-card">
                        <div class="user-avatar">
                            <div class="user-avatar-placeholder">
                                ${(user.firstName[0] + user.lastName[0]).toUpperCase()}
                            </div>
                        </div>
                        <div class="user-info">
                            <h4>${user.firstName} ${user.lastName}</h4>
                            <p>${user.email} • Joined ${dateStr}</p>
                            ${badges}
                            ${stats}
                        </div>
                        <div class="user-actions">
                            ${user.userType !== 'admin' ? `
                                <button class="btn btn-outline btn-small" onclick="toggleUserStatus('${user.id}', ${user.isActive})">
                                    <i class="fas ${user.isActive ? 'fa-ban' : 'fa-check'}"></i>
                                    ${user.isActive ? 'Deactivate' : 'Activate'}
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Populate user name
        if (window.userData) {
            document.getElementById('userName').textContent = window.userData.firstName || 'Admin';
        }
    </script>
</body>
</html>
