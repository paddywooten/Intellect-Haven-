<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find a Teacher - Intellect Haven</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar dashboard-navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="../../index.html">
                    <img src="../../images/logo.png" alt="Intellect Haven" style="height: 50px; width: auto;">
                </a>
            </div>
            <div class="nav-links" id="navLinks">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="children.html" class="nav-link">My Children</a>
                <a href="search.html" class="nav-link active">Find Teacher</a>
                <a href="bookings.html" class="nav-link">Bookings</a>
                <div class="nav-user">
                    <span id="userName">Loading...</span>
                    <button class="btn btn-outline btn-small" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Search Content -->
    <div class="dashboard-container">
        <div class="container">
            <div class="dashboard-header">
                <div class="welcome-message">
                    <h2>Find a Teacher</h2>
                    <p>Browse verified teachers for your child's learning needs</p>
                </div>
            </div>

            <!-- Search Filters -->
            <div class="dashboard-section">
                <div class="search-filters">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="filterSubject">Subject</label>
                            <select id="filterSubject">
                                <option value="">All Subjects</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="English Language">English Language</option>
                                <option value="Science">Science</option>
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Biology">Biology</option>
                                <option value="French">French</option>
                                <option value="ICT">ICT / Computing</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="filterCurriculum">Curriculum</label>
                            <select id="filterCurriculum">
                                <option value="">All Curricula</option>
                                <option value="GES">GES</option>
                                <option value="British">British</option>
                                <option value="Cambridge">Cambridge</option>
                                <option value="IB">IB</option>
                                <option value="Montessori">Montessori</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="filterLevel">School Level</label>
                            <select id="filterLevel">
                                <option value="">All Levels</option>
                                <option value="Nursery">Nursery</option>
                                <option value="Primary">Primary</option>
                                <option value="JHS">JHS</option>
                                <option value="SHS">SHS</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="filterCity">City</label>
                            <select id="filterCity">
                                <option value="">All Cities</option>
                                <option value="Accra">Accra</option>
                                <option value="Kumasi">Kumasi</option>
                                <option value="Tamale">Tamale</option>
                                <option value="Tema">Tema</option>
                                <option value="Takoradi">Takoradi</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="filterMaxRate">Max Hourly Rate (GHS)</label>
                            <input type="number" id="filterMaxRate" placeholder="e.g., 100" min="0">
                        </div>
                        
                        <div class="form-group">
                            <label for="filterMinRating">Minimum Rating</label>
                            <select id="filterMinRating">
                                <option value="">Any Rating</option>
                                <option value="4">4+ Stars</option>
                                <option value="3">3+ Stars</option>
                                <option value="2">2+ Stars</option>
                            </select>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                        <button class="btn btn-primary" onclick="applyFilters()">
                            <i class="fas fa-search"></i> Search Teachers
                        </button>
                        <button class="btn btn-outline" onclick="resetFilters()">
                            <i class="fas fa-times"></i> Reset Filters
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="dashboard-section">
                <div class="section-header">
                    <h3>Available Teachers</h3>
                    <span id="resultsCount">Loading...</span>
                </div>
                <div class="teachers-grid" id="teachersGrid">
                    <div class="loading-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Loading teachers...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 Intellect Haven. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="../../config/firebase-config.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="../../js/app.js"></script>
    <script src="../../js/parent.js"></script>
    
    <script>
        let allTeachers = [];
        
        document.addEventListener('DOMContentLoaded', function() {
            loadTeachers();
        });
        
        async function loadTeachers() {
            try {
                const snapshot = await firebaseDB.collection('teachers')
                    .where('verificationStatus', '==', 'verified')
                    .where('isAvailable', '==', true)
                    .get();
                
                allTeachers = [];
                
                for (const doc of snapshot.docs) {
                    const teacher = { id: doc.id, ...doc.data() };
                    
                    // Get user info
                    const userDoc = await firebaseDB.collection('users').doc(teacher.userId).get();
                    teacher.user = userDoc.data();
                    
                    allTeachers.push(teacher);
                }
                
                renderTeachers(allTeachers);
                
            } catch (error) {
                console.error('Error loading teachers:', error);
                document.getElementById('teachersGrid').innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Error loading teachers</p>
                    </div>
                `;
            }
        }
        
        function renderTeachers(teachers) {
            const container = document.getElementById('teachersGrid');
            const countEl = document.getElementById('resultsCount');
            
            countEl.textContent = `${teachers.length} teacher${teachers.length !== 1 ? 's' : ''} found`;
            
            if (teachers.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="fas fa-search"></i>
                        <p>No teachers found matching your criteria</p>
                        <p>Try adjusting your filters</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = teachers.map(teacher => {
                const rating = teacher.rating || 0;
                const stars = '★'.repeat(Math.floor(rating)) + '☆'.repeat(5 - Math.floor(rating));
                
                return `
                    <div class="teacher-card">
                        <div class="teacher-header">
                            <div class="teacher-avatar">
                                ${teacher.profilePhoto ? 
                                    `<img src="${teacher.profilePhoto}" alt="${teacher.user.firstName}">` : 
                                    `<div class="avatar-placeholder">${(teacher.user.firstName[0] + teacher.user.lastName[0]).toUpperCase()}</div>`
                                }
                            </div>
                            <div class="teacher-info">
                                <h4>${teacher.user.firstName} ${teacher.user.lastName}</h4>
                                <div class="teacher-rating">
                                    <span class="stars">${stars}</span>
                                    <span class="rating-value">${rating.toFixed(1)}</span>
                                    <span class="review-count">(${teacher.totalReviews || 0} reviews)</span>
                                </div>
                            </div>
                        </div>
                        
                        <p class="teacher-bio">${teacher.bio ? teacher.bio.substring(0, 150) + '...' : 'No bio available'}</p>
                        
                        <div class="teacher-details">
                            <div class="teacher-detail">
                                <i class="fas fa-graduation-cap"></i>
                                <span>${teacher.qualification || 'Not specified'}</span>
                            </div>
                            <div class="teacher-detail">
                                <i class="fas fa-briefcase"></i>
                                <span>${teacher.experienceYears || 0} years experience</span>
                            </div>
                            <div class="teacher-detail">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${teacher.location.city}${teacher.location.area ? ', ' + teacher.location.area : ''}</span>
                            </div>
                            <div class="teacher-detail">
                                <i class="fas fa-money-bill-wave"></i>
                                <span><strong>${formatCurrency(teacher.hourlyRate)}</strong> / hour</span>
                            </div>
                        </div>
                        
                        <div class="teacher-subjects">
                            ${teacher.subjects ? teacher.subjects.slice(0, 3).map(s => `<span class="subject-tag">${s}</span>`).join('') : ''}
                            ${teacher.subjects && teacher.subjects.length > 3 ? `<span class="subject-tag">+${teacher.subjects.length - 3} more</span>` : ''}
                        </div>
                        
                        <a href="teacher-profile.html?id=${teacher.id}" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                            <i class="fas fa-user"></i> View Profile
                        </a>
                    </div>
                `;
            }).join('');
        }
        
        function applyFilters() {
            const subject = document.getElementById('filterSubject').value;
            const curriculum = document.getElementById('filterCurriculum').value;
            const level = document.getElementById('filterLevel').value;
            const city = document.getElementById('filterCity').value;
            const maxRate = document.getElementById('filterMaxRate').value;
            const minRating = document.getElementById('filterMinRating').value;
            
            let filtered = allTeachers;
            
            if (subject) {
                filtered = filtered.filter(t => t.subjects && t.subjects.includes(subject));
            }
            
            if (curriculum) {
                filtered = filtered.filter(t => t.curricula && t.curricula.includes(curriculum));
            }
            
            if (level) {
                filtered = filtered.filter(t => t.schoolLevels && t.schoolLevels.includes(level));
            }
            
            if (city) {
                filtered = filtered.filter(t => t.location && t.location.city === city);
            }
            
            if (maxRate) {
                filtered = filtered.filter(t => t.hourlyRate <= parseFloat(maxRate));
            }
            
            if (minRating) {
                filtered = filtered.filter(t => (t.rating || 0) >= parseFloat(minRating));
            }
            
            renderTeachers(filtered);
        }
        
        function resetFilters() {
            document.getElementById('filterSubject').value = '';
            document.getElementById('filterCurriculum').value = '';
            document.getElementById('filterLevel').value = '';
            document.getElementById('filterCity').value = '';
            document.getElementById('filterMaxRate').value = '';
            document.getElementById('filterMinRating').value = '';
            
            renderTeachers(allTeachers);
        }
        
        // Populate user name
        if (window.userData) {
            document.getElementById('userName').textContent = window.userData.firstName || 'Parent';
        }
    </script>
    
    <style>
        .search-filters {
            padding: 1rem;
        }
        
        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .teacher-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .teacher-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }
        
        .teacher-header {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .teacher-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .teacher-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .teacher-info h4 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        
        .teacher-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        
        .stars {
            color: #FFC107;
        }
        
        .rating-value {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .review-count {
            color: var(--text-secondary);
        }
        
        .teacher-bio {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        
        .teacher-details {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
        }
        
        .teacher-detail {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .teacher-detail i {
            color: var(--primary-color);
            width: 20px;
        }
        
        .teacher-subjects {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .subject-tag {
            padding: 0.25rem 0.75rem;
            background: rgba(46, 125, 50, 0.1);
            color: var(--primary-color);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</body>
</html>
